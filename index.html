<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Beloved Husband ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffd6e7);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.container{
width:90%;
max-width:700px;
background:#fff;
padding:30px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#e91e63;
margin-bottom:20px;
}

#question{
font-size:24px;
font-weight:bold;
margin:25px 0;
color:#444;
}

.option{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
background:#e91e63;
color:white;
}

#message{
display:none;
margin-top:20px;
font-size:20px;
color:#e91e63;
}

#nextBtn{
display:none;
margin-top:25px;
padding:12px 35px;
border:none;
border-radius:15px;
background:#ff4081;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ For My Beloved Husband ❤️</h1>

<div id="question">Loading...</div>

<button id="option1" class="option"></button>

<button id="option2" class="option"></button>

<div id="message"></div>

<button id="nextBtn">Next ❤️</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


   

const firebaseConfig = {
  apiKey: "AIzaSyBMkbP9qs-PrOzzzd4x910Yh0F4oYOSyQY",
  authDomain: "for-my-love-3e847.firebaseapp.com",
  projectId: "for-my-love-3e847",
  storageBucket: "for-my-love-3e847.firebasestorage.app",
  messagingSenderId: "17747922285",
  appId: "1:17747922285:web:c1841304e8cce86c801e64",
  measurementId: "G-7R2DF3CKFW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let questions = [];
let current = 0;

const q = document.getElementById("question");
const o1 = document.getElementById("option1");
const o2 = document.getElementById("option2");
const msg = document.getElementById("message");
const next = document.getElementById("nextBtn");

async function loadQuestions() { 
  const snap = await getDocs(collection(db, "answers"));

  questions = snap.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));

  showQuestion();
}
function showQuestion() {

msg.style.display="none";
next.style.display="none";

const item=questions[current];

const questionKey = Object.keys(item).find(key =>
  key.toLowerCase().startsWith("question")
);

q.innerHTML = item[questionKey];

o1.innerHTML=item.option1;

o2.innerHTML=item.option2;

o1.onclick=()=>saveAnswer(item.option1,item.message);

o2.onclick=()=>saveAnswer(item.option2,item.message);

}

async function saveAnswer(answer,message){

await addDoc(collection(db,"responses"),{

question: questions[current][questionKey],

selectedAnswer:answer,

time:new Date()

});

msg.innerHTML=message;

msg.style.display="block";

next.style.display="inline-block";

}

next.onclick=()=>{

current++;

if(current<questions.length){

showQuestion();

}else{

document.querySelector(".container").innerHTML=`

<h1>❤️ Thank You My Love ❤️</h1>

<p style="font-size:24px;margin-top:20px;line-height:40px;">

Thank you for answering every question. ❤️<br><br>

You are my greatest blessing.<br>

I love you today, tomorrow and forever. 💍❤️

</p>

`;

}

};

loadQuestions();

function createHeart(){

const heart=document.createElement("div");

heart.innerHTML="❤️";

heart.style.position="fixed";
heart.style.left=Math.random()*100+"vw";
heart.style.top="-20px";
heart.style.fontSize=(20+Math.random()*20)+"px";
heart.style.pointerEvents="none";
heart.style.animation="fall 5s linear forwards";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

}

setInterval(createHeart,500);

const style=document.createElement("style");

style.innerHTML=`
@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
 `
;

document.head.appendChild(style);

</script>

</body>
</html>
